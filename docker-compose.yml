name: prueba-upc

services:
  db:
    image: postgres:16-alpine
    container_name: prueba-upc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-productos_upc}
      POSTGRES_USER: ${POSTGRES_USER:-prueba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prueba123}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4.8.1
    container_name: prueba-upc-adminer
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: ["api"]
    build: ./api
    container_name: prueba-upc-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://prueba:prueba123@db:5432/productos_upc
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
